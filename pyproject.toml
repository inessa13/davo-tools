[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davo-tools"
version = "1.3.0"
description = "Personal CLI utilities (davo, cit, davo-photo, davo-s3sync)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "davo", email = "davo.fastcall@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml==6.0.3",
    "argcomplete==3.7.0",
    "pillow==12.3.0",
    "exif==1.6.1",
    "pyotp==2.10.0",
    "pexpect==4.9.0",
    "keyring==25.7.0",
    "boto==2.49.0",
    "reprint==0.6.0",
    "pymediainfo==7.0.1",
    "opencv-python==5.0.0.93",
    "numpy==2.4.6",
    "scikit-image==0.26.0",
]
[project.urls]
Homepage = "https://github.com/inessa13/davo-tools"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
]
lint = [
    "ruff==0.16.0",
    "isort==8.0.1",
    "pylint==4.0.6",
]
images = [
    "rembg==2.0.77",
    "onnxruntime==1.28.0",
]
keepass = [
    "pykeepass==4.1.1.post1",
]
full = [
    "rembg==2.0.77",
    "onnxruntime==1.28.0",
    "pykeepass==4.1.1.post1",
    "PyMuPDF==1.28.0",
]

[project.scripts]
davo = "davo.cli:main"
cit = "davo.services.git_tools:main"
davo-photo = "davo.services.photo.cli:main"
davo-s3sync = "davo.services.s3sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
default_section = "THIRDPARTY"
known_first_party = ["davo"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["davo", "tests"]
exclude = [
    ".eggs",
    ".git",
    ".venv",
    "build",
    "dist",
    "htmlcov",
    ".dev",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
default-section = "third-party"
known-first-party = ["davo"]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.reports]
output-format = "colorized"

[tool.pylint.typecheck]
# OpenCV exposes many dynamic members from C-extensions, which triggers
# persistent false positives in pylint (E1101 no-member).
generated-members = ["cv2.*"]
# Decorator factory mutates wrapped callable signature; otherwise pylint raises
# E1120 no-value-for-parameter for valid CLI callbacks.
signature-mutators = ["davo.services.photo.utils.each_file"]

[tool.pylint.messages_control]
disable = [
    "consider-using-f-string",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
